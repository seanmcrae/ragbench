name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v3
      - name: Install
        run: uv sync --frozen --python ${{ matrix.python-version }}
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Test
        run: uv run pytest
      - name: Demo (offline, no API keys)
        run: |
          uv run rag-eval run configs/example.yaml --quiet
          uv run rag-eval report
          uv run rag-eval compare bm25-k5 dense-lsa-k3 --fail-on-regression
      - name: Docs site builds
        run: uv run python scripts/build_site.py --run runs/example --out site
