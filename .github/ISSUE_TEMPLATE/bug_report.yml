name: Bug report
description: Something produces wrong results, crashes, or does not match the docs.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The command and the smallest experiment YAML that shows the problem.
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output or traceback
      render: text
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "0.1.0 or a commit SHA"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Python 3.12, uv 0.5, macOS 15; providers: mock"
  - type: checkboxes
    id: secrets
    attributes:
      label: Before submitting
      options:
        - label: I removed API keys and private corpus content from everything above.
          required: true
