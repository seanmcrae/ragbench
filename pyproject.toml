[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ragbench"
version = "0.1.0"
description = "Evaluation harness that compares RAG and agentic search pipelines on retrieval quality, answer quality, latency and cost-to-serve, and recommends a configuration under a budget."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sean McRae" }]
keywords = ["rag", "retrieval", "evaluation", "llm", "information-retrieval"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "typer>=0.12",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
sentence-transformers = ["sentence-transformers>=3.0"]

[project.urls]
Repository = "https://github.com/seanmcrae/ragbench"

[project.scripts]
rag-eval = "rag_eval.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "types-markdown>=3.6",
]
docs = [
    "jinja2>=3.1",
    "markdown>=3.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rag_eval"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "N"]
# Line length is enforced by the formatter; long string literals in fact tables are left intact.
# A whitespace-split string literal is the readable form for word lists.
ignore = ["E501", "SIM905"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["anthropic.*", "openai.*", "sentence_transformers.*", "sklearn.*", "matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=rag_eval --cov-report=term-missing:skip-covered"

[tool.uv]
# The docs group (static site generator) is small and type-checked with the rest of the repo.
default-groups = ["dev", "docs"]
